<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Abriendo la oferta… | Radar Ofertas MX</title>
<meta name="description" content="Redirección a la página de la oferta en Radar Ofertas MX.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230b0f14'/><circle cx='32' cy='32' r='21' fill='none' stroke='%2317c964' stroke-width='3' opacity='.45'/><circle cx='32' cy='32' r='12' fill='none' stroke='%2317c964' stroke-width='3' opacity='.8'/><circle cx='32' cy='32' r='4.5' fill='%2317c964'/></svg>">
<meta name="theme-color" content="#0b0f14">
<style>
:root{--bg:#f5f6f8;--ink:#0d1117;--mut:#65707e;--green:#17c964;--green-dk:#0a7a3d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
.box{max-width:520px;text-align:center;background:#fff;border:1px solid #e6e9ee;border-radius:20px;padding:38px 30px}
.logo{width:54px;height:54px;margin-bottom:16px}
h1{font-size:1.15rem;font-weight:900;letter-spacing:-.02em;margin-bottom:8px}
p{font-size:.9rem;color:var(--mut);line-height:1.6}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}
.links{margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.links a{font-size:.86rem;font-weight:800;text-decoration:none;color:#fff;background:#0b0f14;padding:12px 20px;border-radius:12px}
.links a.g{background:#fff;color:var(--ink);border:1px solid #e6e9ee}
</style>
</head>
<body>
<div class="box">
  <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0b0f14"/><circle cx="32" cy="32" r="21" fill="none" stroke="#17c964" stroke-width="3" opacity=".45"/><circle cx="32" cy="32" r="12" fill="none" stroke="#17c964" stroke-width="3" opacity=".8"/><circle cx="32" cy="32" r="4.5" fill="#17c964"/></svg>
  <h1 id="t">Abriendo la oferta <span class="dot"></span></h1>
  <p id="m">Un segundo, estamos localizando el producto.</p>
  <div class="links" id="l" hidden>
    <a href="/" id="l1">Ver todas las ofertas</a>
    <a class="g" href="https://t.me/DescuentosPalacio" target="_blank" rel="noopener">Ofertas en Telegram</a>
  </div>
</div>
<script>
/* Redirector de los enlaces viejos /oferta/?s=<tienda>&id=<id> hacia el
   micrositio estatico /oferta/<tienda>/<slug>-<id>/.
   Los links ya publicados en X y Telegram siguen funcionando; esta pagina
   busca el nombre del producto en deals.json y arma el mismo slug que
   micrositios.slugify() en Python. Si cambia alla, cambia aqui. */
(function(){
  var PATHS={palacio:'palacio',amazon:'amazon',costco:'costco',
             mercadolibre:'mercadolibre',ml:'mercadolibre',meli:'mercadolibre',
             coppel:'coppel',elektra:'elektra'};
  function slugify(s){
    s=String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    s=s.replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
    if(s.length>70){s=s.slice(0,70);var i=s.lastIndexOf('-');if(i>=0)s=s.slice(0,i);}
    return s||'oferta';
  }
  function fallback(msg,store){
    document.getElementById('t').textContent='No pudimos abrir esa oferta';
    document.getElementById('m').textContent=msg;
    var l=document.getElementById('l'); l.hidden=false;
    if(store){document.getElementById('l1').href='/'+store+'/';
              document.getElementById('l1').textContent='Ver ofertas de esa tienda';}
  }
  var qs=new URLSearchParams(location.search);
  var store=PATHS[(qs.get('s')||'').toLowerCase()], id=qs.get('id');
  if(!store||!id){ fallback('El enlace viene incompleto.',''); return; }
  fetch('/'+store+'/deals.json?_='+Date.now(),{cache:'no-store'})
    .then(function(r){return r.json();})
    .then(function(data){
      var deals=(data&&data.deals)||[],d=null,i;
      for(i=0;i<deals.length;i++){ if(String(deals[i].id)===String(id)){d=deals[i];break;} }
      if(!d){ fallback('Esa oferta ya salió del radar. Mira las que están vivas ahora.',store); return; }
      location.replace('/oferta/'+store+'/'+slugify(d.name)+'-'+d.id+'/');
    })
    .catch(function(){ fallback('No se pudo cargar el listado. Intenta de nuevo.',store); });
})();
</script>
</body>
</html>
